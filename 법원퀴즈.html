<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 법원 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:  #1e2d40;
    --gold:  #b8860b;
    --amber: #e6a817;
    --green: #2e8b57;
    --red:   #c0392b;
    --bg:    #f5f3ee;
    --white: #ffffff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:'Nanum Gothic',sans-serif;
    background:var(--bg);
    min-height:100vh;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 10% 10%, rgba(184,134,11,.10) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(30,45,64,.09) 0%, transparent 45%);
    pointer-events:none; z-index:0;
  }

  .container { max-width:760px; margin:0 auto; padding:32px 20px 80px; position:relative; z-index:1; }

  /* ── 헤더 ── */
  header { text-align:center; margin-bottom:36px; animation:fadeDown .6s ease both; }
  .badge { display:inline-block; background:var(--navy); color:var(--amber); font-family:'Jua',sans-serif; font-size:13px; letter-spacing:3px; padding:6px 20px; border-radius:999px; margin-bottom:14px; }
  header h1 { font-family:'Jua',sans-serif; font-size:clamp(26px,6vw,42px); color:var(--navy); line-height:1.25; }
  header h1 span { color:var(--gold); }
  header p { margin-top:10px; color:#7a6a4a; font-size:15px; }

  /* ── 진행바 ── */
  .prog-label { text-align:right; font-size:13px; color:#9a8a6a; margin-bottom:6px; animation:fadeDown .6s .1s ease both; }
  .prog-wrap  { background:#e0d8c8; border-radius:999px; height:10px; margin-bottom:30px; overflow:hidden; animation:fadeDown .6s .1s ease both; }
  .prog-bar   { height:100%; background:linear-gradient(90deg,var(--navy),var(--amber)); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1); width:0; }

  /* ── 카드 ── */
  .quiz-card { background:var(--white); border-radius:24px; padding:36px 32px; box-shadow:0 8px 40px rgba(30,45,64,.11); animation:slideUp .5s ease both; position:relative; overflow:hidden; }
  .quiz-card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--navy),var(--gold),var(--amber)); }

  .q-num  { font-family:'Jua',sans-serif; font-size:13px; color:var(--gold); letter-spacing:2px; margin-bottom:10px; }
  .q-text { font-family:'Jua',sans-serif; font-size:clamp(17px,3.5vw,23px); color:var(--navy); line-height:1.55; margin-bottom:26px; }
  .q-hint { font-size:13px; color:#9a8a6a; background:#f5f0e8; padding:8px 14px; border-radius:10px; display:inline-block; margin-bottom:20px; }

  /* ── 보기 ── */
  .options     { display:grid; gap:12px; }
  .options.two { grid-template-columns:1fr 1fr; }
  .opt-btn {
    background:#faf8f4; border:2.5px solid #e0d8c8; border-radius:14px;
    padding:15px 18px; font-family:'Nanum Gothic',sans-serif; font-size:15px; font-weight:700;
    color:var(--navy); cursor:pointer; transition:all .2s; text-align:left;
    display:flex; align-items:center; gap:12px;
  }
  .opt-btn:hover:not(:disabled) { border-color:var(--amber); background:#fffbf0; transform:translateY(-2px); box-shadow:0 4px 14px rgba(184,134,11,.18); }
  .opt-icon { width:32px; height:32px; border-radius:50%; background:#e8e4da; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--navy); flex-shrink:0; transition:all .2s; }
  .opt-btn.correct { border-color:var(--green); background:#f0fff6; color:#1a5e38; }
  .opt-btn.correct .opt-icon { background:var(--green); color:#fff; }
  .opt-btn.wrong   { border-color:var(--red);   background:#fff0ef; color:#922b21; }
  .opt-btn.wrong   .opt-icon { background:var(--red);   color:#fff; }
  .opt-btn.dimmed  { opacity:.35; cursor:not-allowed; }

  /* ── 매칭 퀴즈 ── */
  .match-wrap  { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .match-col   { display:flex; flex-direction:column; gap:10px; }
  .match-label { font-size:13px; color:#7a6a4a; font-weight:700; margin-bottom:4px; text-align:center; }
  .match-left-btn {
    background:#faf8f4; border:2.5px solid #e0d8c8; border-radius:12px;
    padding:12px 14px; font-family:'Nanum Gothic',sans-serif; font-size:14px; font-weight:700;
    color:var(--navy); cursor:pointer; transition:all .2s; text-align:center;
  }
  .match-left-btn:hover  { border-color:var(--amber); background:#fffbf0; }
  .match-left-btn.active { border-color:var(--amber); background:#fff7e0; box-shadow:0 0 0 3px rgba(230,168,23,.3); }
  .match-left-btn.matched { border-color:var(--green); background:#f0fff6; color:#1a5e38; cursor:default; }
  .match-right-btn {
    background:var(--navy); border:none; border-radius:12px;
    padding:12px 14px; font-family:'Nanum Gothic',sans-serif; font-size:14px; font-weight:700;
    color:#fff; cursor:pointer; transition:all .2s; text-align:center;
  }
  .match-right-btn:hover:not(:disabled) { background:#2c4060; transform:scale(1.03); }
  .match-right-btn.matched-ok  { background:var(--green); cursor:default; }
  .match-right-btn.matched-no  { background:var(--red);   }
  .match-check-btn { width:100%; padding:14px; background:var(--amber); border:none; border-radius:12px; font-family:'Jua',sans-serif; font-size:16px; cursor:pointer; color:var(--navy); font-weight:700; transition:all .2s; }
  .match-check-btn:hover { background:var(--gold); transform:translateY(-2px); }

  /* ── 순서 맞추기 ── */
  .order-label  { font-size:13px; color:#7a6a4a; font-weight:700; margin-bottom:6px; }
  .order-pool   { display:flex; flex-wrap:wrap; gap:10px; min-height:52px; border:2.5px dashed #e0d8c8; border-radius:14px; padding:10px; margin-bottom:10px; }
  .order-answer { display:flex; flex-wrap:wrap; gap:10px; min-height:60px; border:2.5px solid #e0d8c8; background:#faf8f4; border-radius:14px; padding:10px; }
  .order-chip   { background:var(--navy); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; user-select:none; transition:all .15s; }
  .order-chip:hover { background:#2c4060; transform:scale(1.04); }
  .check-order-btn { width:100%; padding:14px; background:var(--amber); border:none; border-radius:12px; font-family:'Jua',sans-serif; font-size:16px; cursor:pointer; color:var(--navy); font-weight:700; transition:all .2s; margin-top:12px; }
  .check-order-btn:hover { background:var(--gold); transform:translateY(-2px); }

  /* ── 빈칸 ── */
  .blank-wrap { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .blank-chip { background:var(--navy); color:#fff; padding:10px 18px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; transition:all .15s; }
  .blank-chip:hover { background:#2c4060; transform:scale(1.04); }
  .blank-chip.used  { opacity:.28; cursor:not-allowed; pointer-events:none; }
  .blank-sentence   { font-family:'Jua',sans-serif; font-size:18px; color:var(--navy); line-height:2.2; margin-bottom:18px; }
  .blank-box { display:inline-block; min-width:90px; border-bottom:3px solid var(--amber); margin:0 4px; text-align:center; font-size:17px; font-weight:800; color:var(--amber); cursor:pointer; transition:all .2s; vertical-align:bottom; padding:0 6px; }
  .blank-box.filled    { border-color:var(--gold);  color:var(--gold); }
  .blank-box.correct-b { border-color:var(--green); color:var(--green); }
  .blank-box.wrong-b   { border-color:var(--red);   color:var(--red);  }
  .check-blank-btn { width:100%; padding:14px; background:var(--amber); border:none; border-radius:12px; font-family:'Jua',sans-serif; font-size:16px; cursor:pointer; color:var(--navy); font-weight:700; transition:all .2s; }
  .check-blank-btn:hover { background:var(--gold); transform:translateY(-2px); }

  /* ── 피드백 ── */
  .feedback { margin-top:20px; padding:15px 18px; border-radius:14px; font-size:15px; font-weight:700; display:none; animation:popIn .3s ease both; }
  .feedback.show { display:block; }
  .feedback.ok { background:#eafaf1; color:#1a5e38; border:2px solid #a9dfbf; }
  .feedback.no { background:#fdedec; color:#922b21; border:2px solid #f5b7b1; }

  /* ── 다음 버튼 ── */
  .next-btn { display:none; margin-top:18px; width:100%; padding:16px; background:var(--navy); color:var(--amber); border:none; border-radius:14px; font-family:'Jua',sans-serif; font-size:18px; cursor:pointer; letter-spacing:1px; transition:all .2s; }
  .next-btn:hover { background:#2c4060; transform:translateY(-2px); box-shadow:0 6px 20px rgba(30,45,64,.22); }
  .next-btn.show  { display:block; animation:fadeUp .3s ease both; }

  /* ── 결과 ── */
  #result-screen { display:none; text-align:center; animation:slideUp .6s ease both; }
  .result-trophy { font-size:82px; margin-bottom:14px; animation:bounce .8s .3s ease both; }
  .result-title  { font-family:'Jua',sans-serif; font-size:32px; color:var(--navy); margin-bottom:6px; }
  .result-score  { font-family:'Jua',sans-serif; font-size:54px; color:var(--gold); margin:16px 0; }
  .result-msg    { font-size:16px; color:#6a5a3a; line-height:1.7; margin-bottom:28px; }
  .result-breakdown { background:#faf8f4; border-radius:18px; padding:20px; margin-bottom:26px; text-align:left; }
  .rb-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #e8e0d0; font-size:14px; color:var(--navy); }
  .rb-item:last-child { border-bottom:none; }
  .rb-icon { font-size:20px; width:28px; text-align:center; }
  .retry-btn { padding:18px 40px; background:var(--navy); color:var(--amber); border:none; border-radius:16px; font-family:'Jua',sans-serif; font-size:20px; cursor:pointer; transition:all .2s; }
  .retry-btn:hover { background:#2c4060; transform:translateY(-3px); box-shadow:0 8px 24px rgba(30,45,64,.22); }

  /* ── 애니메이션 ── */
  @keyframes fadeDown  { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideUp   { from{opacity:0;transform:translateY(30px)}  to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp    { from{opacity:0;transform:translateY(10px)}  to{opacity:1;transform:translateY(0)} }
  @keyframes popIn     { from{opacity:0;transform:scale(.9)}         to{opacity:1;transform:scale(1)} }
  @keyframes bounce    { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-18px)} 60%{transform:translateY(-8px)} }
  @keyframes shake     { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .shake { animation:shake .4s ease; }

  @media(max-width:480px){ .options.two{grid-template-columns:1fr} .quiz-card{padding:22px 16px} .match-wrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">⚖️ 사회 퀴즈</div>
    <h1>법원에서 하는 일을<br><span>알아볼까요?</span></h1>
    <p>총 8문제 · 클릭해서 풀어보세요!</p>
  </header>

  <div class="prog-label" id="prog-label">1 / 8</div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>

  <div id="quiz-area"></div>
  <div id="result-screen"></div>
</div>

<script>
const icons = ['①','②','③','④'];
let current=0, score=0, results=[], answered=false;

/* ══════════════════════════════════
   문제 데이터
══════════════════════════════════ */
const questions = [

  /* 1. O/X */
  {
    type:'ox',
    q:'법원은 재판을 통해 옳고 그름을 가려 사회 질서를 유지한다.',
    answer:'O',
    ok:'정답! 법원은 재판으로 옳고 그름을 가리고, 법을 어긴 사람을 처벌해 사회 질서를 지켜요.',
    no:'틀렸어요! 법원은 재판을 통해 사회 질서를 유지하는 곳이에요.',
  },

  /* 2. 재판 종류 매칭 */
  {
    type:'match',
    q:'재판의 종류와 설명을 올바르게 연결해보세요!',
    hint:'💡 왼쪽 재판을 선택한 뒤, 오른쪽 설명을 눌러 연결하세요',
    pairs:[
      { left:'민사재판', right:'개인 간에 발생하는 갈등 해결' },
      { left:'형사재판', right:'법을 지키지 않은 사람 처벌' },
      { left:'행정재판', right:'개인과 행정청 사이 갈등 해결' },
    ],
    ok:'완벽해요! 민사=개인 갈등, 형사=법 위반 처벌, 행정=행정청 갈등이에요.',
    no:'아쉬워요! 민사=개인 갈등 해결, 형사=법 위반 사람 처벌, 행정=행정청과의 갈등 해결이에요.',
  },

  /* 3. 객관식 */
  {
    type:'choice',
    q:'친구와 돈 문제로 다툼이 생겼을 때 이용하는 재판은?',
    options:['형사재판','행정재판','민사재판','선거재판'],
    answer:2,
    ok:'정답! 개인 사이의 갈등은 민사재판으로 해결해요.',
    no:'아쉬워요! 개인(사람) 사이의 갈등 해결은 민사재판이에요.',
  },

  /* 4. 객관식 */
  {
    type:'choice',
    q:'다음 중 <u>형사재판</u>이 필요한 상황은?',
    options:['건물 임대 계약 분쟁','교통사고 합의금 다툼','편의점 절도 사건','학교 급식비 환불 요청'],
    answer:2,
    ok:'정답! 절도(도둑질)는 법을 어긴 것이므로 형사재판으로 처벌해요.',
    no:'아쉬워요! 법을 어긴 범죄(절도)는 형사재판이에요. 나머지는 개인 간 다툼인 민사재판이에요.',
  },

  /* 5. 빈칸 채우기 - 삼심제도 */
  {
    type:'blank',
    sentence:['삼심제도에서 1심은', '법원, 2심은', '법원, 3심은', '이다.'],
    blanks:['지방','고등','대법원'],
    pool:['지방','고등','대법원','헌법','행정'],
    hint:'💡 알맞은 단어를 골라 빈칸을 채워보세요',
    ok:'완벽해요! 1심 지방법원 → 2심 고등법원 → 3심 대법원 순이에요.',
    no:'아쉬워요! 삼심제도: 1심=지방법원, 2심=고등법원, 3심=대법원이에요.',
  },

  /* 6. O/X */
  {
    type:'ox',
    q:'사법권의 독립이란 법원이 다른 기관의 영향을 받지 않고 독립적으로 운영되는 것이다.',
    answer:'O',
    ok:'정답! 공정한 재판을 위해 법원은 독립적으로 운영되고, 판사의 신분과 임기도 보장돼요.',
    no:'틀렸어요! 맞아요! 사법권의 독립은 외부 영향 없이 공정하게 재판하기 위한 제도예요.',
  },

  /* 7. 순서 맞추기 - 삼심제도 */
  {
    type:'order',
    q:'억울한 판결을 받았을 때, 재판을 다시 받는 순서를 맞춰보세요!',
    hint:'💡 카드를 클릭해 순서 칸으로 이동하세요',
    items:['지방법원 (1심)','고등법원 (2심)','대법원 (3심)'],
    answer:['지방법원 (1심)','고등법원 (2심)','대법원 (3심)'],
    ok:'정답! 1심(지방법원) → 2심(고등법원) → 3심(대법원) 순으로 재판을 받을 수 있어요.',
    no:'아쉬워요! 순서는 지방법원(1심) → 고등법원(2심) → 대법원(3심)이에요.',
  },

  /* 8. 객관식 */
  {
    type:'choice',
    q:'공정한 재판을 위한 제도가 <u>아닌</u> 것은?',
    options:['사법권의 독립','삼심제도','공개재판','대통령의 재판 지시'],
    answer:3,
    ok:'정답! 대통령이 재판을 지시하면 사법권의 독립을 해치기 때문에 공정한 재판이 불가능해요.',
    no:'아쉬워요! 대통령의 재판 지시는 사법권 독립을 해쳐 공정한 재판을 방해해요.',
  },
];

/* ══════════════════════════════════
   진행바
══════════════════════════════════ */
function updateProgress(){
  document.getElementById('prog-bar').style.width=(current/questions.length*100)+'%';
  document.getElementById('prog-label').textContent=`${current+1} / ${questions.length}`;
}

/* ══════════════════════════════════
   렌더
══════════════════════════════════ */
function render(){
  updateProgress(); answered=false;
  const q=questions[current];
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  const card=document.createElement('div');
  card.className='quiz-card';
  card.innerHTML=`
    <div class="q-num">문제 ${current+1} / ${questions.length}</div>
    <div class="q-text">${q.q}</div>
    ${q.hint?`<div class="q-hint">${q.hint}</div>`:''}
    <div id="opt-area"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">
      ${current<questions.length-1?'다음 문제 →':'결과 보기 🎉'}
    </button>`;
  area.appendChild(card);
  const oa=document.getElementById('opt-area');
  if(q.type==='choice') renderChoice(q,oa);
  else if(q.type==='ox')    renderOX(q,oa);
  else if(q.type==='match') renderMatch(q,oa);
  else if(q.type==='order') renderOrder(q,oa);
  else if(q.type==='blank') renderBlank(q,oa);
}

/* ── 객관식 ── */
function renderChoice(q,area){
  const grid=document.createElement('div'); grid.className='options';
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button'); btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-icon">${icons[i]}</span>${opt}`;
    btn.onclick=()=>checkChoice(i,q,grid);
    grid.appendChild(btn);
  });
  area.appendChild(grid);
}

/* ── O/X ── */
function renderOX(q,area){
  const grid=document.createElement('div'); grid.className='options two';
  ['O','X'].forEach(v=>{
    const btn=document.createElement('button'); btn.className='opt-btn';
    btn.style.justifyContent='center'; btn.style.fontSize='34px';
    btn.textContent=v==='O'?'⭕':'❌';
    btn.onclick=()=>checkChoice(v,q,grid);
    grid.appendChild(btn);
  });
  area.appendChild(grid);
}

function checkChoice(sel,q,grid){
  if(answered)return; answered=true;
  const btns=grid.querySelectorAll('.opt-btn');
  const correct=q.answer; const isOX=q.type==='ox';
  const isCorrect=sel===correct;
  if(isOX){
    btns.forEach((b,i)=>{
      const v=i===0?'O':'X';
      if(v===correct)b.classList.add('correct');
      else if(v===sel&&!isCorrect){b.classList.add('wrong');b.classList.add('shake');}
      else b.classList.add('dimmed');
      b.disabled=true;
    });
  } else {
    btns.forEach((b,i)=>{
      if(i===correct)b.classList.add('correct');
      else if(i===sel&&!isCorrect){b.classList.add('wrong');b.classList.add('shake');}
      else b.classList.add('dimmed');
      b.disabled=true;
    });
  }
  showFeedback(isCorrect,q);
  if(isCorrect)score++;
  results.push({q:q.q,correct:isCorrect});
}

/* ── 매칭 ── */
function renderMatch(q,area){
  // 오른쪽 셔플
  const rightItems=[...q.pairs.map(p=>p.right)].sort(()=>Math.random()-.5);
  let selectedLeft=null;
  const matchedPairs={}; // left → right

  const wrap=document.createElement('div'); wrap.className='match-wrap';
  const leftCol=document.createElement('div'); leftCol.className='match-col';
  const rightCol=document.createElement('div'); rightCol.className='match-col';

  const lLabel=document.createElement('div'); lLabel.className='match-label'; lLabel.textContent='재판 종류';
  const rLabel=document.createElement('div'); rLabel.className='match-label'; rLabel.textContent='설명';
  leftCol.appendChild(lLabel); rightCol.appendChild(rLabel);

  const leftBtns={}, rightBtns={};

  q.pairs.forEach(p=>{
    const lb=document.createElement('button'); lb.className='match-left-btn';
    lb.textContent=p.left; lb.dataset.key=p.left;
    lb.onclick=()=>{
      if(lb.classList.contains('matched'))return;
      leftBtns[selectedLeft]?.classList.remove('active');
      selectedLeft=p.left;
      lb.classList.add('active');
    };
    leftCol.appendChild(lb);
    leftBtns[p.left]=lb;
  });

  rightItems.forEach(r=>{
    const rb=document.createElement('button'); rb.className='match-right-btn';
    rb.textContent=r; rb.dataset.val=r;
    rb.onclick=()=>{
      if(!selectedLeft||rb.disabled)return;
      // 이미 연결된 right 해제
      const prevLeft=Object.keys(matchedPairs).find(k=>matchedPairs[k]===r);
      if(prevLeft){
        delete matchedPairs[prevLeft];
        leftBtns[prevLeft].classList.remove('matched');
        leftBtns[prevLeft].style.borderColor='';
      }
      matchedPairs[selectedLeft]=r;
      leftBtns[selectedLeft].classList.remove('active');
      leftBtns[selectedLeft].classList.add('matched');
      leftBtns[selectedLeft].style.borderColor='#e6a817';
      selectedLeft=null;
      // 연결 표시
      const paired=Object.keys(matchedPairs).find(k=>matchedPairs[k]===r);
      // highlight right
      Object.values(rightBtns).forEach(b=>b.style.outline='');
      rb.style.outline='3px solid #e6a817';
    };
    rightCol.appendChild(rb);
    rightBtns[r]=rb;
  });

  wrap.appendChild(leftCol); wrap.appendChild(rightCol);

  const checkBtn=document.createElement('button'); checkBtn.className='match-check-btn';
  checkBtn.textContent='✅ 연결 확인하기';
  checkBtn.onclick=()=>{
    if(answered)return;
    if(Object.keys(matchedPairs).length<q.pairs.length){
      const fb=document.getElementById('feedback');
      fb.className='feedback no show'; fb.textContent='⚠️ 모든 재판 종류를 연결해주세요!'; return;
    }
    let correct=0;
    q.pairs.forEach(p=>{
      const rb=rightBtns[matchedPairs[p.left]];
      if(matchedPairs[p.left]===p.right){ correct++; rb.classList.add('matched-ok'); leftBtns[p.left].style.borderColor='#2e8b57'; }
      else { rb.classList.add('matched-no'); leftBtns[p.left].style.borderColor='#c0392b'; }
      rb.disabled=true;
    });
    Object.values(leftBtns).forEach(b=>{ b.disabled=true; b.classList.remove('active'); });
    const isCorrect=correct===q.pairs.length;
    answered=true; checkBtn.disabled=true;
    showFeedback(isCorrect,q);
    if(isCorrect)score++;
    results.push({q:'재판 종류 매칭',correct:isCorrect});
  };

  area.appendChild(wrap);
  area.appendChild(checkBtn);
}

/* ── 순서 맞추기 ── */
function renderOrder(q,area){
  const shuffled=[...q.items].sort(()=>Math.random()-.5);
  const pLabel=document.createElement('div'); pLabel.className='order-label'; pLabel.textContent='📦 보기 카드 (클릭 → 아래 이동)';
  const pool=document.createElement('div'); pool.className='order-pool';
  const aLabel=document.createElement('div'); aLabel.className='order-label'; aLabel.style.marginTop='14px'; aLabel.textContent='📋 순서 칸 (클릭 → 되돌리기)';
  const ans=document.createElement('div'); ans.className='order-answer';
  shuffled.forEach(item=>pool.appendChild(makeChip(item,pool,ans)));
  const checkBtn=document.createElement('button'); checkBtn.className='check-order-btn';
  checkBtn.textContent='✅ 순서 확인하기';
  checkBtn.onclick=()=>checkOrder(q,ans,checkBtn);
  area.appendChild(pLabel); area.appendChild(pool);
  area.appendChild(aLabel); area.appendChild(ans);
  area.appendChild(checkBtn);
}
function makeChip(text,from,to){
  const chip=document.createElement('div'); chip.className='order-chip';
  chip.textContent=text; chip.dataset.text=text;
  chip.onclick=()=>{ chip.parentElement===from?to.appendChild(chip):from.appendChild(chip); };
  return chip;
}
function checkOrder(q,ansArea,btn){
  if(answered)return;
  const placed=[...ansArea.querySelectorAll('.order-chip')].map(c=>c.dataset.text);
  if(placed.length!==q.answer.length){
    const fb=document.getElementById('feedback');
    fb.className='feedback no show'; fb.textContent=`⚠️ 카드 ${q.answer.length}개를 모두 순서 칸에 놓아주세요!`; return;
  }
  const isCorrect=placed.every((v,i)=>v===q.answer[i]);
  ansArea.querySelectorAll('.order-chip').forEach((c,i)=>{
    c.style.background=c.dataset.text===q.answer[i]?'#2e8b57':'#c0392b';
  });
  answered=true; btn.disabled=true;
  showFeedback(isCorrect,q);
  if(isCorrect)score++;
  results.push({q:q.q,correct:isCorrect});
}

/* ── 빈칸 채우기 ── */
function renderBlank(q,area){
  document.querySelector('.q-text').textContent='빈칸에 알맞은 말을 넣어보세요!';
  const shuffled=[...q.pool].sort(()=>Math.random()-.5);
  const chipWrap=document.createElement('div'); chipWrap.className='blank-wrap';
  shuffled.forEach(w=>{
    const chip=document.createElement('div'); chip.className='blank-chip';
    chip.textContent=w; chip.dataset.val=w;
    chip.onclick=()=>fillBlank(chip,boxEls);
    chipWrap.appendChild(chip);
  });
  const sent=document.createElement('div'); sent.className='blank-sentence';
  const boxEls=[];
  q.sentence.forEach((part,i)=>{
    sent.appendChild(document.createTextNode(part));
    if(i<q.blanks.length){
      const box=document.createElement('span'); box.className='blank-box';
      box.textContent='___'; box.dataset.answer=q.blanks[i]; box.dataset.filled='';
      box.onclick=()=>clearBlank(box,chipWrap);
      sent.appendChild(box); boxEls.push(box);
    }
  });
  const checkBtn=document.createElement('button'); checkBtn.className='check-blank-btn';
  checkBtn.textContent='✅ 확인하기';
  checkBtn.onclick=()=>checkBlank(q,boxEls,checkBtn);
  area.appendChild(chipWrap); area.appendChild(sent); area.appendChild(checkBtn);
}
function fillBlank(chip,boxes){
  if(chip.classList.contains('used'))return;
  const empty=boxes.find(b=>b.dataset.filled==='');
  if(!empty)return;
  empty.textContent=chip.dataset.val; empty.dataset.filled=chip.dataset.val;
  empty.classList.add('filled'); chip.classList.add('used');
}
function clearBlank(box,chipWrap){
  if(box.dataset.filled==='')return;
  const val=box.dataset.filled;
  chipWrap.querySelectorAll('.blank-chip').forEach(c=>{ if(c.dataset.val===val&&c.classList.contains('used')){ c.classList.remove('used'); return; } });
  box.textContent='___'; box.dataset.filled=''; box.classList.remove('filled','correct-b','wrong-b');
}
function checkBlank(q,boxes,btn){
  if(answered)return;
  if(!boxes.every(b=>b.dataset.filled!=='')){
    const fb=document.getElementById('feedback');
    fb.className='feedback no show'; fb.textContent='⚠️ 모든 빈칸을 채워주세요!'; return;
  }
  const isCorrect=boxes.every(b=>b.dataset.filled===b.dataset.answer);
  boxes.forEach(b=>{ b.classList.remove('filled'); b.classList.add(b.dataset.filled===b.dataset.answer?'correct-b':'wrong-b'); });
  answered=true; btn.disabled=true;
  showFeedback(isCorrect,q);
  if(isCorrect)score++;
  results.push({q:'삼심제도 빈칸 채우기',correct:isCorrect});
}

/* ── 피드백 ── */
function showFeedback(isCorrect,q){
  const fb=document.getElementById('feedback');
  fb.className='feedback '+(isCorrect?'ok':'no')+' show';
  fb.textContent=(isCorrect?'🎉 ':'💡 ')+(isCorrect?q.ok:q.no);
  document.getElementById('next-btn').classList.add('show');
}

/* ── 다음 ── */
function nextQ(){ current++; current>=questions.length?showResult():render(); }

/* ── 결과 ── */
function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.querySelector('.prog-wrap').style.display='none';
  document.getElementById('prog-label').style.display='none';
  const pct=Math.round(score/questions.length*100);
  let trophy='🥉',msg='조금 더 공부해봐요! 다시 도전해보세요.';
  if(pct===100){trophy='🏆';msg='완벽해요! 법원 박사님이시네요! 👏';}
  else if(pct>=75){trophy='🥇';msg='훌륭해요! 법원에 대해 잘 알고 있어요!';}
  else if(pct>=50){trophy='🥈';msg='절반 이상 맞혔어요! 조금만 더 복습해봐요.';}
  const rs=document.getElementById('result-screen'); rs.style.display='block';
  rs.innerHTML=`
    <div class="result-trophy">${trophy}</div>
    <div class="result-title">퀴즈 완료!</div>
    <div class="result-score">${score} / ${questions.length}</div>
    <p class="result-msg">${msg}</p>
    <div class="result-breakdown">
      ${results.map((r,i)=>`<div class="rb-item"><span class="rb-icon">${r.correct?'✅':'❌'}</span><span>문제 ${i+1}: ${r.correct?'정답':'오답'}</span></div>`).join('')}
    </div>
    <button class="retry-btn" onclick="restart()">🔄 다시 풀기</button>`;
}

function restart(){
  current=0;score=0;results=[];
  document.getElementById('quiz-area').style.display='block';
  document.querySelector('.prog-wrap').style.display='block';
  document.getElementById('prog-label').style.display='block';
  document.getElementById('result-screen').style.display='none';
  render();
}

render();
</script>
